<title>口字岛</title>
<style>
:root{color-scheme:light;--ink:#242852;--muted:#535977;--violet:#4d397a;--paper:#fffdfa;--bg:#f5f0e7;--line:#ddd5ce;--plum:#ece4fa;--mint:#dff2e7;--gold:#fce6ae;--font:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;--glyph:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--font)}main{width:min(1030px,100%);margin:auto;padding:clamp(15px,4vw,42px)}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.55rem,5vw,2.6rem);line-height:1.2}h2{font-size:clamp(1.45rem,4vw,2.15rem);line-height:1.25}button{font:inherit;color:inherit;min-height:48px;cursor:pointer;border:1px solid #9a88b4;border-radius:12px;background:var(--paper);padding:8px 14px;font-weight:750;touch-action:manipulation}button:hover{background:#f3edfd}button:focus-visible{outline:3px solid #91512c;outline-offset:3px}button:disabled{opacity:.55;cursor:default}button.primary{background:var(--violet);border-color:var(--violet);color:white}button.primary:hover{background:#3d2a67}
header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:17px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:50px;height:50px;border-radius:14px;background:var(--gold);border:1px solid #d7b671;font:800 29px var(--glyph)}.quiet{font-size:.93rem;color:var(--muted)}.page{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,36px);box-shadow:0 8px 29px #4933350c}.page>p:first-of-type{margin-top:5px}.group{margin-top:17px}.home-grid{display:grid;grid-template-columns:minmax(140px,.65fr) minmax(0,1.7fr);gap:15px;margin-top:22px}
.anchor{background:var(--plum);border:1px solid #cdbbe9;border-radius:17px;display:grid;justify-items:center;align-content:center;min-height:200px;padding:16px}.anchor strong{font:800 clamp(4.5rem,13vw,8rem)/1.05 var(--glyph);color:#563e86}.anchor .quiet{margin-top:8px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.component{display:grid;place-items:center;min-height:94px;font:800 clamp(2.25rem,6vw,3.5rem)/1 var(--glyph);border-radius:15px;background:var(--mint);border-color:#abcbb8}.component:nth-child(even){background:#f9e9c2;border-color:#d6c59b}.component:hover{background:#cce5da}.component:nth-child(even):hover{background:#f3db9b}
.entry-grid{display:grid;grid-template-columns:minmax(165px,.72fr) minmax(0,1.35fr);gap:17px;margin:16px 0}.hero{background:var(--plum);display:grid;justify-items:center;align-content:center;gap:8px;padding:16px;border-radius:16px}.hero strong{font:750 clamp(5.5rem,15vw,9rem)/1.08 var(--glyph)}.hero span{font-size:1.4rem;font-weight:800}.stack{display:grid;gap:10px}.fact{padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:#fffcf5}.fact h3{font-size:1rem;margin-bottom:2px}.mini{display:inline-grid;place-items:center;min-width:40px;min-height:42px;padding:2px 5px;background:var(--mint);border-radius:7px;font:750 1.55rem var(--glyph)}.mini.mouth{background:var(--plum);color:#563e86}.diagram{display:inline-flex;gap:3px;vertical-align:middle;margin-right:7px}.diagram.vertical{display:inline-flex;flex-direction:column}.structure-line{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.example strong{color:#423070}.exercise{margin-top:14px;padding:clamp(13px,4vw,24px);border:1px solid #d2c4e5;border-radius:14px;background:#f5efff}.formula{font:800 clamp(2rem,7vw,3.6rem)/1.3 var(--glyph);overflow-wrap:anywhere}.status{margin-top:12px;min-height:1.6em;font-weight:700}.status[data-tone="error"]{color:#94392f}.status[data-tone="ok"]{color:#235c41}.parts{margin:14px 0}.parts button{min-width:72px;min-height:66px;font-size:1.8rem}.parts button[aria-pressed="true"]{background:var(--plum);border-color:var(--violet)}
.slots{display:flex;align-items:stretch;gap:9px;margin-top:12px}.slots.vertical{flex-direction:column;max-width:155px}.slot{display:grid;place-items:center;min-width:100px;min-height:85px;background:#f6f2fc;border:2px dashed #ae9cc8}.slot span:first-child{font-size:.81rem;color:var(--muted)}.slot span:last-child{font:800 2rem/1.15 var(--glyph)}.slot.filled{border-style:solid;background:var(--plum)}

@media(max-width:580px){.entry-grid{grid-template-columns:1fr}.home-grid{grid-template-columns:minmax(78px,.68fr) minmax(0,1.5fr);gap:9px}.anchor{min-height:125px;padding:5px}.anchor strong{font-size:clamp(2.6rem,12vw,4.3rem)}.anchor .quiet{font-size:.75rem}.choices{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.component{min-height:64px;padding:5px}.hero{grid-template-columns:auto auto;justify-content:center}.hero strong{font-size:5rem}.hero button{grid-column:1/-1}.slot{min-width:91px}}

<style>
:root{
  --ink:#183d46;--muted:#4a6267;--violet:#195b63;--paper:#fffdf2;--bg:#f7f2e4;
  --line:#d9ddc8;--mint:#dbefe3;--plum:#e5f1e8;--gold:#f7ce7e;
}
body{background:var(--bg)}
main{width:min(1010px,100%);padding-top:clamp(18px,5vw,43px)}
header{border-bottom:1px solid #d5ddd1;padding:0 0 14px;margin-bottom:20px}
.brand h1{font-weight:900;letter-spacing:.07em}
.brand .quiet{font-size:.85rem;font-weight:750;letter-spacing:.13em}
button{border-color:#a9bdb0;background:var(--paper)}
button:hover{background:#e9f4e8}
button.primary:hover{background:#10434b}
.page{border-radius:25px;padding:clamp(15px,4vw,34px);box-shadow:0 9px 28px #5b675610}
#home>p{margin:6px 0 15px}
.home-grid{
  position:relative;isolation:isolate;
  grid-template-columns:minmax(74px,.8fr) minmax(0,1.85fr);
  align-items:center;gap:clamp(8px,5vw,58px);
  margin:0;min-height:clamp(255px,48vw,430px);
  padding:clamp(16px,7vw,85px);
  border-radius:25px;
  background:#cbe5e4;overflow:hidden;
}
.home-grid::before,.home-grid::after{content:"";position:absolute;pointer-events:none}
.home-grid::before{
  inset:9% 4.4% 10%;background:#eee1ac;
  border-radius:42% 46% 35% 40% / 47% 42% 50% 42%;z-index:-1;
  box-shadow:0 10px #b9bd8f,0 16px #a6cfcb;
}
.home-grid::after{
  z-index:-1;inset:19% 13% 19% 22%;
  border:2px dashed #91966e73;border-radius:45% 18% 42% 50%;
}
.anchor{
  width:100%;max-width:162px;min-height:0;aspect-ratio:1/1;border-radius:36%;
  justify-self:center;background:#f7bf66;border:1px solid #b67a38;
  box-shadow:0 9px #bc803f,0 13px 15px #6b552b33;
}
.anchor strong{font-size:clamp(3.2rem,10vw,7rem);color:#583d21;margin:0}
.choices{grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,2vw,19px)}
.component,.component:nth-child(even){
  grid-column:span 2;min-height:clamp(61px,15vw,104px);padding:3px;
  background:#fff8de;border:1px solid #b2b295;border-radius:clamp(11px,2.2vw,19px);
  box-shadow:0 6px #adba91,0 9px 11px #586d4133;
  font-size:clamp(1.65rem,6vw,3.65rem);color:#244c4b;
}
.component:nth-child(4){grid-column:2 / span 2}
.component:hover,.component:nth-child(even):hover{background:#ffe5a7;transform:translateY(-2px)}
.component:focus-visible{outline-offset:2px}
.glide{
  position:absolute;left:0;top:0;z-index:3;pointer-events:none;display:grid;place-items:center;
  width:60px;height:65px;border:1px solid #b6a467;border-radius:13px;
  background:#ffedaa;box-shadow:0 5px #b69454;font:800 2.6rem/1 var(--glyph);
}
.entry-grid{margin-top:20px;grid-template-columns:minmax(230px,1.16fr) minmax(0,1fr);gap:19px}
.hero{display:grid;align-content:start;gap:0;padding:0;background:#f8ead0;border:1px solid #dfd7be;overflow:hidden}
.hero-letter{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;padding:9px}
.hero strong{font-size:clamp(4rem,12vw,7rem)}
.hero img{width:100%;height:clamp(155px,30vw,270px);object-fit:contain;background:#faf3e3}
.fact{background:#fffdf6;border-color:#d8e2d3}.fact h3{color:#246158}
.mini.mouth{background:#f7dfa8;color:#5c4527}
.exercise,.slot{background:#ecf4e8;border-color:#b6cbb5}
.slot.filled,.parts button[aria-pressed="true"]{background:#f7e4b3;border-color:#a98e51}
.practice-board{
  margin-top:18px;padding:clamp(22px,5vw,45px) 15px;
  background:#e6efe2;border:1px solid #c7d6bb;border-radius:23px;
  box-shadow:inset 0 0 0 8px #edf4ea
}
.quiz-tiles,.practice-board .slots{display:flex;justify-content:center;align-items:center;gap:16px;margin:0}
.practice-board.vertical .quiz-tiles,.practice-board .slots.vertical{flex-direction:column;gap:12px;max-width:none}
.quiz-tile,.practice-board .slot{
  display:grid;place-items:center;width:clamp(90px,19vw,132px);height:clamp(95px,21vw,140px);
  border-radius:17px;background:#fff8e1;border:1px solid #bcbc9d;
  box-shadow:0 6px #adb99b;font:800 clamp(3rem,10vw,4.8rem)/1 var(--glyph)
}
.practice-board .slot{background:#f6faef;border:2px dashed #8eac98;box-shadow:none;padding:7px;grid-template-rows:auto 1fr}
.practice-board .slot:not(.filled) span:last-child{font-size:1.7rem;color:#789184}
.practice-board .slot.filled{background:#fff5d1;border:1px solid #b9a36d;box-shadow:0 4px #c4b384}
.practice-board .slot.filled span:last-child{font-size:clamp(2.7rem,9vw,4rem)}
.practice-board .parts{
  justify-content:center;gap:14px;margin:26px 0 0;padding-top:17px;border-top:1px solid #b9cdb7
}
.practice-board .parts button{
  width:74px;height:74px;border-radius:14px;background:#ffe7ac;border:1px solid #b89e62;
  box-shadow:0 4px #c4a96b;font-size:2.6rem
}
.practice-board .parts button:not(:disabled),.practice-board .slot.filled:not(:disabled){touch-action:none;cursor:grab;user-select:none}
.drag-tile{
  position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-54%);
  display:grid;place-items:center;width:74px;height:74px;border-radius:14px;
  color:#183d46;background:#ffdf98;border:1px solid #9f7c41;box-shadow:0 6px #a38854;
  font:800 2.6rem/1 var(--glyph)
}
#quiz .controls,#build .controls{justify-content:center}
#success{
  width:min(475px,calc(100% - 28px));overflow:hidden;border:1px solid #bcc6ad;
  border-radius:25px;padding:0;color:var(--ink);background:#fffbed;box-shadow:0 18px 60px #163c3c50
}
#success::backdrop{background:#183d466e}
.success-card{position:relative;z-index:1;display:grid;justify-items:center;gap:11px;text-align:center;padding:clamp(21px,6vw,40px)}
.success-stamp{
  display:grid;place-items:center;width:72px;height:72px;border-radius:24px;
  background:#f9d98b;border:1px solid #cc9b47;box-shadow:0 5px #d3aa62;
  font-size:2.6rem;font-weight:900;color:#265c54
}
.success-actions{justify-content:center;margin-top:7px}
.celebration{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.celebration span{
  position:absolute;left:var(--side);top:76%;width:8px;height:13px;border-radius:2px;
  animation:confetti-burst 1.25s ease-out both
}
@keyframes confetti-burst{
  0%{opacity:0;transform:translate(0,0) rotate(0)}
  12%{opacity:.95}
  65%{opacity:.9;transform:translate(var(--x),var(--y)) rotate(var(--turn))}
  100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 85px)) rotate(var(--turn))}
}
@media(max-width:560px){
  .entry-grid{grid-template-columns:1fr}
  .hero{grid-template-columns:.9fr 1.1fr;align-items:center}
  .hero-letter{display:grid;justify-items:center;gap:4px}
  .hero button{grid-column:auto}
  .home-grid{padding:16px 12px;border-radius:19px;gap:11px}
  .choices{gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .component,.component:nth-child(4){grid-column:auto}
  .component:nth-child(5){grid-column:1/-1;justify-self:center;width:48%}
}
@media(prefers-reduced-motion:reduce){.component:hover{transform:none}}

</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div><p class="quiet">添「口」歌</p><h1>口字岛</h1></div></div>
    <button type="button" id="home-button" hidden>⌂ 回首页</button>
  </header>
  <section class="page" id="home" aria-labelledby="home-title">
    <h2 id="home-title" tabindex="-1">给「口」找朋友</h2>
    <p>看看你抽到的字，再点一个部件，和「口」拼一拼。</p>
    <div class="home-grid">
      <div class="anchor"><strong>口</strong></div>
      <div class="choices" id="choices" role="group" aria-label="可选部件"></div>
    </div>
  </section>
  <section class="page" id="entry" aria-labelledby="entry-title" hidden>
    <h2 id="entry-title" tabindex="-1">认识这个字</h2>
    <div class="entry-grid">
      <div class="hero">
        <div class="hero-letter"><strong id="glyph"></strong><span id="pinyin" lang="zh-Latn" hidden></span><button type="button" id="pronounce">🔊 听读音</button></div>
        <img id="entry-art" alt="" hidden>
      </div>
      <div class="stack">
        <div class="fact"><h3>形 · 字形和结构</h3><div class="structure-line"><div id="diagram" class="diagram" aria-hidden="true"><span class="mini mouth">口</span><span class="mini" id="diagram-part"></span></div><p id="structure"></p></div></div>
        <div class="fact"><h3>音</h3><p id="reading"></p></div>
        <div class="fact"><h3>义</h3><p id="meaning"></p></div>
        <div class="fact example"><h3>例句</h3><p id="example"></p></div>
      </div>
    </div>
    <div class="row split"><button type="button" id="read-entry">🔊 听字卡</button><button type="button" class="primary" id="start-quiz">我学会了</button></div>
  </section>
  <section class="page" id="quiz" aria-labelledby="quiz-title" hidden>
    <h2 id="quiz-title" tabindex="-1">这样拼对吗？</h2>
    <div id="quiz-board" class="practice-board" role="group" aria-label="判断部件的位置">
      <div class="quiz-tiles"><span id="quiz-first" class="quiz-tile"></span><span id="quiz-second" class="quiz-tile"></span></div>
    </div>
    <div class="row controls"><button type="button" id="yes">正确</button><button type="button" id="no">不正确</button><button type="button" id="read-question">🔊 听题目</button></div>
    <p id="quiz-status" class="status" role="status"></p>
    <div class="row" id="quiz-done" hidden><button type="button" class="study-again">再学这个字</button><button type="button" class="primary back-home">继续查字</button></div>
  </section>
  <section class="page" id="build" aria-labelledby="build-title" hidden>
    <h2 id="build-title" tabindex="-1"></h2>
    <p>把下面的字片拖进格子。也可以先点字片，再点格子。</p>
    <div class="practice-board" id="build-board">
      <div class="slots" id="slots" aria-label="拼字位置"></div>
      <div class="row parts" id="parts" aria-label="可用部件"></div>
    </div>
    <div class="row controls"><button type="button" class="primary" id="check">检查答案</button><button type="button" id="reset">重新拼</button></div>
    <p id="build-status" class="status" role="status"></p>
    <div class="row" id="build-done" hidden><button type="button" class="study-again" id="back-entry">再学这个字</button><button type="button" class="primary back-home">继续查字</button></div>
  </section>
  <p id="audio-status" class="quiet group" role="status" hidden></p>
</main>
<dialog id="success" aria-labelledby="success-title" aria-describedby="success-note">
  <div class="celebration" id="celebration" aria-hidden="true"></div>
  <div class="success-card">
    <div class="success-stamp" aria-hidden="true">✓</div>
    <h2 id="success-title">恭喜答对了！</h2>
    <p id="success-note"></p>
    <div class="row success-actions">
      <button type="button" class="study-again">再学这个字</button>
      <button type="button" class="primary back-home">继续查字</button>
    </div>
  </div>
</dialog>
<script>
'use strict';
const entries = [
  {glyph:'吓',part:'下',pinyin:'xià',tone:'第四声',cue:'吓一跳',meaning:'让人突然感到害怕或吃惊。',example:'门突然砰的一声关上，妹妹吓了一跳。'},
  {glyph:'吐',part:'土',pinyin:'tǔ',tone:'第三声',cue:'吐泡泡',meaning:'把嘴里的东西弄出来。',example:'刷完牙，他把漱口水吐进洗手盆。'},
  {glyph:'叮',part:'丁',pinyin:'dīng',tone:'第一声',cue:'叮咬',meaning:'这里指蚊子一类的小虫用口刺人的皮肤。',example:'蚊子在我手上叮了一下。',quizRight:true},
  {glyph:'吃',part:'乞',pinyin:'chī',tone:'第一声',cue:'吃蛋糕',meaning:'把食物放进嘴里，嚼一嚼，再吞下去。',example:'生日那天，我们一起吃蛋糕。'},
  {glyph:'号',part:'丂',pinyin:'hào',tone:'第四声',cue:'号角',meaning:'在「号角」里，它指一种可以吹响的乐器。',example:'小朋友把号角吹响了。',vertical:true}
];
const get = id => document.getElementById(id);
const pages = ['home','entry','quiz','build'];
const supportedAudio = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let current = entries[0];
let picked = '';
let placed = ['', ''];
let finished = false;
let spokenQuiz = '';
let chooseEntry = (entry) => showEntry(entry);
let soundContext;

function screen(id) {
  if (supportedAudio) speechSynthesis.cancel();
  pages.forEach(page => {get(page).hidden = page !== id;});
  get('home-button').hidden = id === 'home';
  get('audio-status').hidden = true;
  get(id+'-title').focus();
}

function speak(text) {
  if (!supportedAudio) {reportAudio('这个浏览器暂时不能播放读音。');return;}
  get('audio-status').hidden = true;
  speechSynthesis.cancel();
  const voice = new SpeechSynthesisUtterance(text);
  const available = speechSynthesis.getVoices();
  voice.voice = available.find(item => /^(zh[-_](CN|SG)|zh[-_]Hans)/i.test(item.lang)) ||
    available.find(item => /^zh/i.test(item.lang)) || null;
  voice.lang = voice.voice?.lang || 'zh-CN';
  voice.rate = .84;
  voice.onerror = event => {
    if (!['canceled','interrupted'].includes(event.error)) reportAudio('播放失败，请检查设备是否启用了华文语音。');
  };
  speechSynthesis.speak(voice);
}

function reportAudio(text) {
  get('audio-status').textContent = text;
  get('audio-status').hidden = false;
}

function labelStatus(id,message,tone='') {
  const node = get(id);
  node.textContent = message;
  node.dataset.tone = tone;
}

function successSound() {
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  if (!AudioEngine) return;
  try {
    soundContext ||= new AudioEngine();
    if (soundContext.state === 'suspended') soundContext.resume().catch(()=>{});
    const volume = soundContext.createGain();
    volume.gain.value = .30;
    volume.connect(soundContext.destination);
    const start = soundContext.currentTime + .02;
    const melody = [523.25,659.25,783.99,1046.50];
    melody.forEach((frequency,index) => {
      const note = soundContext.createOscillator();
      const envelope = soundContext.createGain();
      const time = start + index*.10;
      note.type = 'sine';
      note.frequency.value = frequency;
      envelope.gain.setValueAtTime(.001,time);
      envelope.gain.exponentialRampToValueAtTime(.37,time+.023);
      envelope.gain.exponentialRampToValueAtTime(.001,time+.22);
      note.connect(envelope);
      envelope.connect(volume);
      note.start(time);
      note.stop(time+.23);
      note.onended = () => {
        note.disconnect();
        envelope.disconnect();
        if (index === melody.length-1) volume.disconnect();
      };
    });
  } catch {}
}

function celebrate(origin) {
  const dialog = get('success');
  get('success-note').textContent = '你找对了「'+current.glyph+'」的部件位置。';
  const confetti = get('celebration');
  confetti.replaceChildren();
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const colors = ['#ef9550','#2b927e','#f4c24b','#db7480','#68a8c6'];
    for (let i=0;i<24;i++) {
      const piece = document.createElement('span');
      const angle = (i%12)/11*Math.PI;
      const distance = 96+(i*19)%115;
      piece.style.background = colors[i%colors.length];
      piece.style.setProperty('--side',i<12?'17%':'83%');
      piece.style.setProperty('--x',Math.cos(angle)*distance+'px');
      piece.style.setProperty('--y',-Math.sin(angle)*distance+'px');
      piece.style.setProperty('--turn',((i%2?1:-1)*(170+i*17))+'deg');
      confetti.append(piece);
    }
  }
  if (supportedAudio) speechSynthesis.cancel();
  dialog.showModal();
  successSound();
  dialog.addEventListener('close',()=>{
    confetti.replaceChildren();
    if (!get(origin).hidden) get(origin).querySelector('button').focus();
  },{once:true});
}

function positionNames() {
  return current.vertical ? ['上方','下方'] : ['左边','右边'];
}

function showEntry(entry) {
  current = entry;
  const [one,two] = positionNames();
  get('entry-title').textContent = '认识「'+entry.glyph+'」';
  get('glyph').textContent = entry.glyph;
  get('pinyin').textContent = entry.pinyin;
  const art = get('entry-art');
  const illustration = window.workshopArt?.[entry.glyph];
  if (illustration) {
    art.src = illustration;
    art.alt = ['女孩听见门响，张大嘴巴，吓了一跳','男孩把漱口水吐进洗手盆','蚊子叮在手臂上，女孩疼得叫了一声','孩子张开嘴吃蛋糕','孩子用嘴吹响号角'][entries.indexOf(entry)];
  }
  art.hidden = !illustration;
  get('diagram').classList.toggle('vertical',Boolean(entry.vertical));
  get('diagram-part').textContent = entry.part;
  get('structure').textContent = (entry.vertical ? '上下结构' : '左右结构')+'。'+one+'是「口」，'+two+'是「'+entry.part+'」。';
  get('reading').textContent = entry.pinyin+'，'+entry.tone;
  get('meaning').textContent = entry.meaning;
  get('example').textContent = entry.example;
  screen('entry');
}

function openQuiz() {
  const [one,two] = positionNames();
  const first = current.quizRight ? '口' : current.part;
  const second = current.quizRight ? current.part : '口';
  get('quiz-first').textContent = first;
  get('quiz-second').textContent = second;
  get('quiz-board').classList.toggle('vertical',Boolean(current.vertical));
  spokenQuiz = current.part === '丂'
    ? '把号角的号下半部摆在'+one+'，把口摆在'+two+'，能拼成号角的号吗？'
    : '把'+first+'放在'+one+'，把'+second+'放在'+two+'，这样能拼成「'+current.cue+'」的「'+current.glyph+'」吗？';
  get('quiz-done').hidden = true;
  get('yes').disabled = false;
  get('no').disabled = false;
  labelStatus('quiz-status','');
  screen('quiz');
}

function openBuild() {
  picked = '';
  placed = ['', ''];
  finished = false;
  get('build-title').textContent = '动手拼「'+current.glyph+'」';
  get('build-done').hidden = true;
  get('slots').classList.toggle('vertical',Boolean(current.vertical));
  labelStatus('build-status','');
  updateBuilder();
  screen('build');
}

function respond(correct) {
  if (!correct) {openBuild();return;}
  if (!current.quizRight) {
    labelStatus('quiz-status','再看一看这两个部件的位置，然后选一次。','error');
    return;
  }
  labelStatus('quiz-status','答对了！「口」在左边，「丁」在右边，合起来是「叮」。','ok');
  get('yes').disabled = true;
  get('no').disabled = true;
  get('quiz-done').hidden = false;
  celebrate('quiz-done');
}

function placePart(part,index) {
  const previous = placed.indexOf(part);
  const existing = placed[index];
  if (previous !== -1) placed[previous] = existing;
  placed[index] = part;
  picked = '';
  labelStatus('build-status','');
  updateBuilder('slot-'+index);
}

function enableDrag(button,part) {
  let pointer;
  let ghost;
  let suppress = false;
  const clear = () => {ghost?.remove();ghost = undefined;pointer = undefined;};
  button.addEventListener('pointerdown',event => {
    if (finished || event.button !== 0 || !event.isPrimary) return;
    pointer = {id:event.pointerId,x:event.clientX,y:event.clientY};
    if (event.isTrusted) button.setPointerCapture(event.pointerId);
  });
  button.addEventListener('pointermove',event => {
    if (pointer?.id !== event.pointerId) return;
    if (!ghost && Math.hypot(event.clientX-pointer.x,event.clientY-pointer.y)<6) return;
    if (!ghost) {
      ghost = document.createElement('span');
      ghost.className = 'drag-tile';
      ghost.textContent = part;
      ghost.setAttribute('aria-hidden','true');
      document.body.append(ghost);
    }
    ghost.style.left = event.clientX+'px';
    ghost.style.top = event.clientY+'px';
  });
  button.addEventListener('pointerup',event => {
    if (pointer?.id !== event.pointerId) return;
    const moved = Boolean(ghost);
    clear();
    if (!moved) return;
    suppress = true;
    setTimeout(()=>{suppress=false;},0);
    const slot = document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-drop-index]');
    if (slot) placePart(part,Number(slot.dataset.dropIndex));
  });
  button.addEventListener('pointercancel',clear);
  button.addEventListener('lostpointercapture',clear);
  button.addEventListener('click',event=>{
    if (suppress) event.stopImmediatePropagation();
  },true);
}

function updateBuilder(focusId) {
  const parts = [current.part,'口'];
  get('parts').replaceChildren(...parts.map((part,i) => {
    const button = document.createElement('button');
    button.id = 'piece-'+i;
    button.type = 'button';
    button.textContent = part;
    button.setAttribute('aria-pressed',String(part === picked));
    button.disabled = finished || placed.includes(part);
    enableDrag(button,part);
    button.addEventListener('click',() => {
      picked = picked === part ? '' : part;
      labelStatus('build-status',picked ? '选了「'+picked+'」。再点要放的位置。' : '');
      updateBuilder(button.id);
    });
    return button;
  }));
  get('slots').replaceChildren(...positionNames().map((name,i) => {
    const button = document.createElement('button');
    button.id = 'slot-'+i;
    button.type = 'button';
    button.disabled = finished;
    button.className = 'slot'+(placed[i] ? ' filled' : '');
    button.dataset.dropIndex = i;
    const label = document.createElement('span');
    label.textContent = name;
    const value = document.createElement('span');
    value.textContent = placed[i] || '＋';
    button.append(label,value);
    button.setAttribute('aria-label',name+(placed[i] ? '，已放「'+placed[i]+'」' : '，空格'));
    if (placed[i]) enableDrag(button,placed[i]);
    button.addEventListener('click',() => {
      if (picked) {
        placePart(picked,i);
        return;
      } else if (placed[i]) {
        placed[i] = '';
        labelStatus('build-status','已取回部件。');
      } else {
        labelStatus('build-status','先选一个部件，再点这个位置。','error');
      }
      updateBuilder(button.id);
    });
    return button;
  }));
  get('check').disabled = finished;
  get('reset').disabled = finished;
  if (focusId) get(focusId)?.focus();
}

get('check').addEventListener('click',() => {
  if (placed.some(part => !part)) {labelStatus('build-status','两个位置都要放好，再检查。','error');return;}
  if (placed[0] !== '口' || placed[1] !== current.part) {
    labelStatus('build-status','再看看「口」应该放在'+positionNames()[0]+'还是'+positionNames()[1]+'。','error');
    return;
  }
  finished = true;
  labelStatus('build-status','拼对了！这是「'+current.glyph+'」，读 '+current.pinyin+'。','ok');
  get('build-done').hidden = false;
  updateBuilder();
  celebrate('build-done');
});

entries.forEach(entry => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'component';
  button.textContent = entry.part;
  button.setAttribute('aria-label','选择部件「'+entry.part+'」');
  button.addEventListener('click',() => chooseEntry(entry));
  get('choices').append(button);
});
get('home-button').addEventListener('click',() => screen('home'));
document.querySelectorAll('.back-home').forEach(button => button.addEventListener('click',() => {
  if (get('success').open) get('success').close();
  screen('home');
}));
get('pronounce').addEventListener('click',() => speak(current.glyph));
get('read-entry').addEventListener('click',() => speak(current.cue+'的'+current.glyph+'。'+current.tone+'。'+current.meaning+'例句。'+current.example));
get('start-quiz').addEventListener('click',openQuiz);
get('yes').addEventListener('click',() => respond(true));
get('no').addEventListener('click',() => respond(false));
get('read-question').addEventListener('click',() => speak(spokenQuiz));
get('reset').addEventListener('click',openBuild);
document.querySelectorAll('.study-again').forEach(button => button.addEventListener('click',() => {
  if (get('success').open) get('success').close();
  showEntry(current);
}));
</script>

const map = document.querySelector('.home-grid');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let assembling = false;

chooseEntry = entry => {
  if (assembling) return;
  if (reducedMotion.matches || typeof Element.prototype.animate !== 'function') {
    showEntry(entry);
    return;
  }
  assembling = true;
  const origin = map.getBoundingClientRect();
  const start = [map.querySelector('.anchor'),get('choices').children[entries.indexOf(entry)]];
  const center = [(origin.width-60)/2,(origin.height-65)/2];
  const offsets = entry.vertical ? [[0,-35],[0,35]] : [[-32,0],[32,0]];
  const clones = start.map((tile,index) => {
    const copy = document.createElement('span');
    copy.className = 'glide';
    copy.setAttribute('aria-hidden','true');
    copy.textContent = index === 0 ? '口' : entry.part;
    const rect = tile.getBoundingClientRect();
    const from = [rect.left-origin.left+(rect.width-60)/2,rect.top-origin.top+(rect.height-65)/2];
    const to = [center[0]+offsets[index][0],center[1]+offsets[index][1]];
    map.append(copy);
    const motion = copy.animate([
      {transform:'translate('+from[0]+'px,'+from[1]+'px)',opacity:1},
      {transform:'translate('+to[0]+'px,'+to[1]+'px)',opacity:1}
    ],{duration:320,easing:'ease-out',fill:'forwards'});
    return {copy,motion};
  });
  Promise.allSettled(clones.map(item => item.motion.finished)).then(() => {
    clones.forEach(item => item.copy.remove());
    assembling = false;
    showEntry(entry);
  });
};
